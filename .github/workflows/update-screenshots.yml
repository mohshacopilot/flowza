# Flowza screenshot baselines (spec 007 UI-10, plan 007 sections 10 and 12, PA5): started by hand ("Run workflow").
# Runs the whole end-to-end suite exactly like CI's end-to-end job, but writes every screenshot of
# 07-visual-design.spec.ts anew (--update-snapshots=all) on CI's Linux runner, where the baselines must come from (fonts
# differ between Windows and Linux). The new images are uploaded as the artifact "screenshot-baselines". This workflow
# never commits or pushes: the owner looks at the images first (O2), then they are committed with
# "test(ui): accept new screenshots ...".
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  screenshots:
    name: Make new screenshot baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Web/package-lock.json
            tests/EndToEnd/package-lock.json

      - name: Start SQL Server 2019 and create the databases
        run: bash .github/scripts/start-sql-server.sh

      - name: Install the end-to-end packages and Chromium
        working-directory: tests/EndToEnd
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium

      # The whole suite (as in CI), so the screens show the same data as when CI compares them later.
      - name: Run the end-to-end tests and write new screenshots
        env:
          FLOWZA_E2E_SCREENSHOTS: '1'
        run: pwsh -NoProfile -Command "& tests/EndToEnd/run-e2e.ps1 -PlaywrightArgs '--update-snapshots=all'"

      - name: Upload the new baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: tests/EndToEnd/specs/*-snapshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/EndToEnd/playwright-report/
            tests/EndToEnd/test-results/
            tests/EndToEnd/logs/
          retention-days: 14
