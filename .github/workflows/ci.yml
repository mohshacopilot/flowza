# Flowza CI (T031, PLT-09, tech discussion T9): every push and pull request to main is built and tested on a clean
# Linux machine against SQL Server 2019 (constitution 6.3), and line coverage of the Domain and Application code must
# be at least 80 % (constitution 5.6). A red run means the change is not done (DV4).
# Three jobs: .NET build + tests + coverage gate; the web app's lint, types, tests and build; the Playwright
# end-to-end tests against the whole platform started by Aspire (T029, tech discussion TE5). The licence check joins
# once its tool is approved.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Throwaway SQL Server 2019 with random, masked passwords; sets FLOWZA_Sql__Password for the tests.
      - name: Start SQL Server 2019 and create the databases
        run: bash .github/scripts/start-sql-server.sh

      - name: Restore
        run: |
          dotnet restore Flowza.slnx
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build Flowza.slnx --no-restore

      - name: Test with coverage
        run: >-
          dotnet test --solution Flowza.slnx --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[Flowza.*.Domain]*"
          --coverlet-include "[Flowza.*.Application]*"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: >-
          dotnet reportgenerator
          "-reports:TestResults/*.cobertura*.xml"
          -targetdir:coverage
          "-reporttypes:JsonSummary;HtmlSummary;Cobertura"

      - name: Coverage gate (80 % of Domain + Application)
        shell: pwsh
        run: ./.github/scripts/check-coverage.ps1 -Summary coverage/Summary.json -Minimum 80

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint (no warnings allowed)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  end-to-end:
    name: End-to-end (Playwright, whole platform)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Web/package-lock.json
            tests/EndToEnd/package-lock.json

      # Same throwaway SQL Server 2019 as the build job; sets FLOWZA_Sql__Password, which run-e2e.ps1 hands to Aspire.
      - name: Start SQL Server 2019 and create the databases
        run: bash .github/scripts/start-sql-server.sh

      - name: Install the end-to-end packages and Chromium
        working-directory: tests/EndToEnd
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium

      # Builds, empties the flowza_test_* databases, starts the AppHost on them, loads the demo data, runs Playwright.
      # The look check (spec 007 UI-10): the main screens are compared with the approved screenshots in
      # tests/EndToEnd/specs/07-visual-design.spec.ts-snapshots; a difference fails the job and the report below keeps
      # the expected, actual and diff images. A new look is accepted with the "Update screenshots" workflow.
      - name: Run the end-to-end tests
        env:
          FLOWZA_E2E_SCREENSHOTS: '1'
        run: pwsh -NoProfile -File tests/EndToEnd/run-e2e.ps1

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/EndToEnd/playwright-report/
            tests/EndToEnd/test-results/
            tests/EndToEnd/logs/
          retention-days: 14
